version: '3.8'
services:
  # ============================================================
  # BACKEND
  # ============================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GRAPH_STORE=neo4j
      - RELATIONAL_STORE=postgres
      - CACHE_BACKEND=redis
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=repointel
      - POSTGRES_USER=repointel
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - VECTOR_STORE=faiss
      - FAISS_INDEX_PATH=/data/faiss
      - ENABLE_SONAR=${ENABLE_SONAR:-0}
      - SONAR_URL=http://sonarqube:9000
      - SONAR_TOKEN=${SONAR_TOKEN}
    depends_on:
      - neo4j
      - postgres
      - redis
    volumes:
      - ../backend:/app
      - faiss_data:/data/faiss
    networks:
      - repointel

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: python -m app.workers.ingestion_worker
    environment:
      - GRAPH_STORE=neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      - redis
      - postgres
      - neo4j
    volumes:
      - faiss_data:/data/faiss
      - repo_clones:/data/repos
    networks:
      - repointel

  # ============================================================
  # DATABASES
  # ============================================================
  neo4j:
    image: neo4j:5.15
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    networks:
      - repointel

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=repointel
      - POSTGRES_USER=repointel
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - repointel

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - repointel

  # ============================================================
  # STATIC ANALYSIS (optional — enable with ENABLE_SONAR=1)
  # ============================================================
  sonarqube:
    image: sonarqube:10.3-community
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=${SONAR_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
    networks:
      - repointel

  # ============================================================
  # MONITORING (§18)
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - repointel

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - repointel

volumes:
  neo4j_data:
  postgres_data:
  redis_data:
  sonarqube_data:
  faiss_data:
  repo_clones:
  prometheus_data:
  grafana_data:

networks:
  repointel:
    driver: bridge
