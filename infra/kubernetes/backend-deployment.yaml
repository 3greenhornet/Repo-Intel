apiVersion: apps/v1
kind: Deployment
metadata:
  name: repointel-backend
  namespace: repointel
spec:
  replicas: 3
  selector:
    matchLabels:
      app: repointel-backend
  template:
    metadata:
      labels:
        app: repointel-backend
    spec:
      containers:
      - name: backend
        image: <YOUR_REGISTRY>/repointel-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: GRAPH_STORE
          value: neo4j
        - name: NEO4J_URI
          valueFrom:
            secretKeyRef:
              name: repointel-secrets
              key: neo4j-uri
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: repointel-config
              key: postgres-host
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: repointel-secrets
              key: openai-api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: repointel-secrets
              key: github-token
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: faiss-data
          mountPath: /data/faiss
      volumes:
      - name: faiss-data
        persistentVolumeClaim:
          claimName: repointel-faiss
---
apiVersion: v1
kind: Service
metadata:
  name: repointel-backend
  namespace: repointel
spec:
  selector:
    app: repointel-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: repointel-faiss
  namespace: repointel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
