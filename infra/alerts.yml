groups:
- name: repointel
  rules:
  - alert: HighQueryLatency
    expr: histogram_quantile(0.95, rate(repointel_query_latency_seconds_bucket[5m])) > 10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Query latency p95 > 10s"
  - alert: HighErrorRate
    expr: rate(repointel_queries_total{status="error"}[5m]) > 0.1
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Error rate > 10%"
